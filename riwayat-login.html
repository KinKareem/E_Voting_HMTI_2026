<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilih NIM — E-Voting HMTI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main class="auth-page">
    <div class="auth-card-single akun-card">
      <img class="brand-logo" src="logo/musang.png" alt="Logo Musang HMTI 2026" />
      <p class="brand-eyebrow">E-Voting HMTI</p>
      <h2 class="pane-title">Pilih akun Anda</h2>
      <p class="pane-subtitle">
        Cari NIM atau nama Anda, pilih akun, lalu masukkan password untuk masuk.
      </p>

      <div id="akun-status" class="status-msg hidden"></div>

      <div class="field">
        <label for="akun-cari">Cari NIM atau nama</label>
        <input type="search" id="akun-cari" placeholder="Ketik minimal 3 karakter..." autocomplete="off" />
      </div>

      <ul class="akun-list" id="akun-list" aria-label="Hasil pencarian akun"></ul>

      <form id="akun-form">
        <div class="field hidden" id="akun-password-field">
          <label for="akun-password">Password untuk <strong id="akun-terpilih"></strong></label>
          <input type="password" id="akun-password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary" id="akun-masuk" disabled>Masuk</button>
      </form>

      <p class="auth-footer">
        <a href="index.html">Kembali ke halaman masuk</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/Supabaseclient.js"></script>
  <script src="js/Auth.js"></script>
  <script src="js/Riwayatlogin.js"></script>
</body>

</html>
