<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lupa Password — E-Voting Ketua HMTI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lora:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card-single">
      <p class="brand-eyebrow" style="color: var(--gold-600)">E-Voting HMTI</p>
      <h1 class="pane-title" style="margin-top: 10px">Lupa Password</h1>
      <p class="pane-subtitle">
        Masukkan NIM Anda, tautan reset password akan dikirim ke email yang terdaftar.
      </p>

      <div id="forgot-status" class="status-msg hidden"></div>

      <form id="forgot-form">
        <div class="field">
          <label for="forgot-nim">NIM</label>
          <input type="text" id="forgot-nim" placeholder="2305551xxx" required />
        </div>
        <button type="submit" class="btn-primary" id="forgot-submit">Kirim Tautan Reset</button>
      </form>

      <p class="auth-footer">
        <a href="index.html">Kembali ke halaman masuk</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/Supabaseclient.js"></script>
  <script src="js/Auth.js"></script>
  <script src="js/Forgotpassword.js"></script>
</body>
</html>
