<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin — E-Voting Ketua HMTI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="brand-panel">
        <div>
          <img class="brand-logo" src="logo/musang.png" alt="Logo Musang HMTI 2026" />
          <p class="brand-eyebrow">Panel Admin</p>
          <h1 class="brand-title">Panitia Pemilihan Ketua HMTI</h1>
          <div class="gold-rule"></div>
          <p class="brand-description">
            Kelola kandidat, sesi voting, dan verifikasi peserta pemilu dari satu dasbor.
          </p>
        </div>
        <p class="brand-footer">Fakultas Teknik &middot; Universitas Udayana</p>
      </div>

      <div class="form-panel">
        <div class="auth-track-wrap">
          <div class="auth-track" id="auth-track">
            <!-- Pane: LOGIN ADMIN -->
            <div class="auth-pane">
              <form id="login-form">
                <h2 class="pane-title">Masuk Admin</h2>
                <p class="pane-subtitle">Khusus panitia pemilihan HMTI. Akun admin dibuat oleh pengelola sistem.</p>

                <div id="login-status" class="status-msg hidden"></div>

                <div class="field">
                  <label for="login-nim">NIM / ID Admin</label>
                  <input type="text" id="login-nim" required />
                </div>
                <div class="field">
                  <label for="login-password">Password</label>
                  <input type="password" id="login-password" placeholder="••••••••" required />
                </div>

                <button type="submit" class="btn-primary" id="login-submit">Masuk</button>
              </form>
            </div>
          </div>
        </div>

        <p class="auth-footer">
          Bukan panitia? <a href="index.html">Masuk sebagai mahasiswa</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/Supabaseclient.js"></script>
  <script src="js/Auth.js"></script>
  <script src="js/Adminpage.js"></script>
</body>

</html>
