<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>List Voting — Panel Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lora:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <div class="admin-layout">
    <div id="sidebar-root"></div>

    <main class="dashboard-main">
      <div class="dashboard-inner">
        <header class="page-header">
          <div>
            <p class="page-eyebrow">Panel Admin</p>
            <h1 class="page-title">List Voting</h1>
            <p class="page-subtitle" id="voting-summary">Memuat data...</p>
          </div>
          <button class="btn-primary" id="export-btn" style="width: auto; padding: 10px 18px">
            Ekspor CSV (Data SKP)
          </button>
        </header>

        <div class="filter-row">
          <div class="filter-pills" id="filter-pills">
            <button class="filter-pill active" data-filter="semua">Semua</button>
            <button class="filter-pill" data-filter="sudah">Sudah Voting</button>
            <button class="filter-pill" data-filter="belum">Belum Voting</button>
          </div>
          <input type="text" class="search-input" id="search-input" placeholder="Cari NIM atau nama..." />
        </div>

        <div id="voting-error" class="status-msg error hidden"></div>

        <div class="table-card">
          <div class="table-scroll">
            <div id="voting-content" class="empty-msg">Memuat data...</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/Supabaseclient.js"></script>
  <script src="../js/Sidebar.js"></script>
  <script src="../js/Listvoting.js"></script>
</body>

</html>
